<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Outer Body -->
  <rect x="2" y="2" width="28" height="28" rx="7" fill="#09090b" stroke="#09090b" stroke-width="2"/>
  <!-- Display Screen -->
  <rect x="6" y="5" width="20" height="6" rx="2" fill="#ffffff"/>
  <!-- Top Left Key (+) -->
  <rect x="6" y="14" width="8" height="6" rx="2" fill="#18181b"/>
  <line x1="10" y1="15.5" x2="10" y2="18.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8.5" y1="17" x2="11.5" y2="17" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Top Right Key (-) -->
  <rect x="18" y="14" width="8" height="6" rx="2" fill="#18181b"/>
  <line x1="20.5" y1="17" x2="23.5" y2="17" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bottom Left Key (×) -->
  <rect x="6" y="22" width="8" height="6" rx="2" fill="#18181b"/>
  <line x1="8.8" y1="23.8" x2="11.2" y2="26.2" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="11.2" y1="23.8" x2="8.8" y2="26.2" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bottom Right Key (÷) -->
  <rect x="18" y="22" width="8" height="6" rx="2" fill="#18181b"/>
  <line x1="20.5" y1="25" x2="23.5" y2="25" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="22" cy="23.5" r="0.75" fill="#ffffff"/>
  <circle cx="22" cy="26.5" r="0.75" fill="#ffffff"/>
</svg>
